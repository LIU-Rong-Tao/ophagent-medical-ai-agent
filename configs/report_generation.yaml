# OphAgent v0.2.2 report generation config

report:
  # 可选：
  # - openai
  # - rule_based
  provider: openai

  # API 不可用时自动回退
  fallback_provider: rule_based

  # OpenAI 模型配置
  model: gpt-4o-mini
  temperature: 0.2
  timeout: 30

  # 从环境变量读取 API key
  # 不在 YAML 中保存真实 key
  api_key_env: OPENAI_API_KEY

  language: zh

  # 当前报告仅用于研究展示，不用于临床诊断
  disclaimer: true
