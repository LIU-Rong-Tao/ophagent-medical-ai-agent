schema_version: 1
recipe:
  recipe_id: timm_full_train
  display_name: 通用全量微调
  recipe_kind: engineering
  evaluation_role: engineering_screening
  trainer_adapter: timm_imagefolder_v1
  supported_model_families: [convnext, swin, vit]
  description: 统一工程初筛的全量微调配置；不代表任何模型的官方协议或性能上限
model:
  freeze_backbone: false
training:
  epochs: 30
  batch_size: 32
  image_size: 224
  amp: true
  grad_accum_steps: 1
  seed: 42
  early_stopping_patience: 8
optimizer:
  name: adamw
  learning_rate: 0.0001
  weight_decay: 0.01
  momentum: 0.9
scheduler:
  name: cosine
  warmup_epochs: 2
  minimum_learning_rate: 0.000001
  step_size: 10
  gamma: 0.1
loss:
  name: cross_entropy
  label_smoothing: 0.1
  class_weights: null
augmentation:
  random_resized_crop: false
  horizontal_flip_probability: 0.5
  rotation_degrees: 10.0
  color_jitter: 0.0
evaluation:
  save_best_by: macro_f1
runtime:
  device: cuda:2
  num_workers: 4
