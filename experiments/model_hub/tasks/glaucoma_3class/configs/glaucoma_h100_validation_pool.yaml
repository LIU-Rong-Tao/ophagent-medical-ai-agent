evaluation_design: retrospective_validation_selection_split_integrity_limited
result_semantics: validation_cached_probability_replay
confirmatory_test: false
test_result_based_selection: false
route_eligible: false
output_dir: experiments/model_hub/tasks/glaucoma_3class/outputs/validation_pool
model_hub_output_dir: experiments/model_hub/tasks/glaucoma_3class/outputs/validation_pool
