    - {name: dr_vit_predictions, source: experiments/v0_8_5c_timm_adapter_activation/work/activation/onboarded_models/dr_vit_b_imagenet_adapter/predictions.csv, target: onboarded_models/dr_vit_b_imagenet_adapter/predictions.csv}
