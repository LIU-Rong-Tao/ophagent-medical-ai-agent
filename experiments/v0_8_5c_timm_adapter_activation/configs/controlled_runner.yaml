    - {name: dr_convnext_manifest, source: experiments/v0_8_5c_timm_adapter_activation/work/activation/onboarded_models/dr_convnext_tiny_adapter/adapter_manifest.csv, target: onboarded_models/dr_convnext_tiny_adapter/adapter_manifest.csv}
