protocol_id: v086_interactive_model_hub
mode: exploratory
selection_split: test
evaluation_split: test
risk_metric_profile: generic_multiclass
cost_scope: forward_only
output_dir: experiments/v0_8_6_interactive_model_hub/outputs

stages:
  - id: model_hub
    kind: routing
    command:
      - "{python}"
      - scripts/routing/run_interactive_model_hub.py
      - --config
      - experiments/v0_8_6_interactive_model_hub/configs/protocol.yaml
      - --output-dir
      - experiments/v0_8_6_interactive_model_hub/work/interactive
      - --stage
      - model_hub
    inputs:
      - scripts/routing/run_interactive_model_hub.py
      - experiments/v0_8_6_interactive_model_hub/configs/protocol.yaml
      - experiments/v0_8_6_interactive_model_hub/configs/pairing_protocols.csv
      - experiments/v0_8_5_model_registry_scout_expert_protocol/configs/task_registry.csv
      - experiments/v0_8_5_model_registry_scout_expert_protocol/outputs/registered_models.csv
      - experiments/v0_8_5_model_registry_scout_expert_protocol/outputs/model_baselines_all.csv
      - experiments/v0_8_5b_known_model_inventory_adapter_onboarding/outputs/model_inventory.csv
      - experiments/v0_8_5c_timm_adapter_activation/outputs/adapter_job_summary.csv
      - experiments/v0_8_5c_timm_adapter_activation/outputs/onboarded_models.csv
      - experiments/v0_8_5c_timm_adapter_activation/outputs/model_baselines_from_adapters.csv
      - experiments/v0_8_5c_timm_adapter_activation/outputs/forward_cost_summary_from_adapters.csv
      - experiments/v0_8_5c_timm_adapter_activation/configs/routing_replay_protocols.csv
    outputs:
      - experiments/v0_8_6_interactive_model_hub/work/interactive/model_hub_snapshot.csv

  - id: pairing
    kind: routing
    depends_on: [model_hub]
    command:
      - "{python}"
      - scripts/routing/run_interactive_model_hub.py
      - --config
      - experiments/v0_8_6_interactive_model_hub/configs/protocol.yaml
      - --output-dir
      - experiments/v0_8_6_interactive_model_hub/work/interactive
      - --stage
      - pairing
    inputs:
      - scripts/routing/run_interactive_model_hub.py
      - experiments/v0_8_6_interactive_model_hub/configs/protocol.yaml
      - experiments/v0_8_6_interactive_model_hub/configs/pairing_protocols.csv
      - experiments/v0_8_6_interactive_model_hub/work/interactive/model_hub_snapshot.csv
      - experiments/v0_8_5c_timm_adapter_activation/outputs/onboarded_models/*/predictions.csv
      - experiments/aptos_retfound_mae_cfp_official_protocol/official_protocol_bs24_epoch50_seed0/evaluation/test/test_predictions.csv
      - experiments/v0_8_3_glaucoma_scout_routing/retfound_dinov2_glaucoma_expert/evaluation/test/test_predictions.csv
    outputs:
      - experiments/v0_8_6_interactive_model_hub/work/interactive/pairing_results.csv
      - experiments/v0_8_6_interactive_model_hub/work/interactive/case_routing_trace.csv

  - id: report
    kind: report
    depends_on: [pairing]
    command:
      - "{python}"
      - scripts/routing/run_interactive_model_hub.py
      - --config
      - experiments/v0_8_6_interactive_model_hub/configs/protocol.yaml
      - --output-dir
      - experiments/v0_8_6_interactive_model_hub/work/interactive
      - --stage
      - report
    inputs:
      - scripts/routing/run_interactive_model_hub.py
      - experiments/v0_8_6_interactive_model_hub/configs/protocol.yaml
      - experiments/v0_8_6_interactive_model_hub/work/interactive/model_hub_snapshot.csv
      - experiments/v0_8_6_interactive_model_hub/work/interactive/pairing_results.csv
      - experiments/v0_8_6_interactive_model_hub/work/interactive/case_routing_trace.csv
    outputs:
      - experiments/v0_8_6_interactive_model_hub/work/interactive/run_config.yaml
      - experiments/v0_8_6_interactive_model_hub/work/interactive/artifact_manifest.csv
      - experiments/v0_8_6_interactive_model_hub/work/interactive/report.html

publish:
  generate_runner_report: false
  stable_manifest_paths: true
  report: report.html
  path_rewrites:
    - source_prefix: experiments/v0_8_6_interactive_model_hub/work/interactive
      target_prefix: experiments/v0_8_6_interactive_model_hub/outputs
  artifacts:
    - {name: model_hub_snapshot, source: experiments/v0_8_6_interactive_model_hub/work/interactive/model_hub_snapshot.csv, target: model_hub_snapshot.csv}
    - {name: pairing_results, source: experiments/v0_8_6_interactive_model_hub/work/interactive/pairing_results.csv, target: pairing_results.csv}
    - {name: case_routing_trace, source: experiments/v0_8_6_interactive_model_hub/work/interactive/case_routing_trace.csv, target: case_routing_trace.csv}
    - {name: run_config, source: experiments/v0_8_6_interactive_model_hub/work/interactive/run_config.yaml, target: run_config.yaml}
    - {name: interactive_report, source: experiments/v0_8_6_interactive_model_hub/work/interactive/report.html, target: report.html}
