  - scripts/routing/verify_aptos_replay_pool.py
  - --config
  - experiments/opening_risk_routing_closure/configs/protocols/aptos_h100_six_model_pool.yaml
  - --model
  - preti
  inputs:
  - scripts/routing/verify_aptos_replay_pool.py
  - experiments/opening_risk_routing_closure/replays/preti/seed42_20260722/predictions/validation_predictions.csv
  - experiments/opening_risk_routing_closure/replays/preti/seed42_20260722/predictions/test_predictions.csv
