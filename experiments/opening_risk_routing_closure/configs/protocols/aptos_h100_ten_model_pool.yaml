  validation_predictions: predictions/validation_predictions.csv
  test_predictions: predictions/test_predictions.csv
  required_artifacts:
  - run_summary.json
  - replay_audit.json
  - costs/forward_cost.json
- model_id: flair
  adapter: flair_frozen_encoder_linear_head
  checkpoint_path: external_h100_asset_reference
  preprocessing_id: flair_foreground_crop_aspect_canvas512_rgb_fp32
  existing_replay: replays/flair/full_replay_20260722
  validation_predictions: predictions/validation_predictions.csv
  test_predictions: predictions/test_predictions.csv
  required_artifacts:
