  - replay_audit.json
  - costs/forward_cost.json
- model_id: eyeclip_cfp
  adapter: eyeclip_frozen_encoder_linear_probe
  checkpoint_path: /training_data/lizekun/model_cache/ophbench/eyeclip/eyeclip-default/eyeclip.pt
  preprocessing_id: eyeclip_clip_transform_224
  existing_replay: replays/eyeclip_cfp/20260723T082659Z
  validation_predictions: predictions/validation_predictions.csv
  test_predictions: predictions/test_predictions.csv
  required_artifacts:
  - run_summary.json
  - artifact_manifest.json
  - costs/forward_cost.json
- model_id: keepfit_cfp
