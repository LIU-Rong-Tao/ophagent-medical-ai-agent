  - artifact_manifest.json
  - costs/forward_cost.json
- model_id: ret_clip
  adapter: ret_clip_frozen_encoder_linear_probe
  checkpoint_path: /training_data/lizekun/model_cache/ophbench/ret-clip/ret-clip-default/ret-clip.pt
